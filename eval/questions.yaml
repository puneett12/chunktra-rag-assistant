# Evaluation set — document-scoped.
#
# In a 4-document corpus, "the agreement" was unambiguous. In a 100+ document
# corpus it is not: nearly every contract has a termination clause, and no
# retriever can know which one you meant. Real users name the contract.
#
# Every question below names its document. They were rewritten uniformly —
# including ones that already passed — so the benchmark changed, not the
# scoring. The original unscoped set is kept in questions_unscoped.yaml.
#
# Fields:
#   question      what a user would actually ask, in their own words
#   expect_doc    doc_id (the filename without extension) holding the answer
#   expect_text   a distinctive phrase that MUST appear in the retrieved chunk
#   unanswerable  true if the corpus genuinely does not cover it

questions:

  # --- ABC Company Master Services Agreement -------------------------------
  - question: "What is the notice period for terminating the ABC Company agreement?"
    expect_doc: "abc-company-master-services-agreement"
    expect_text: "ninety (90) days written notice"

  - question: "Does the ABC Company contract renew automatically?"
    expect_doc: "abc-company-master-services-agreement"
    expect_text: "automatically renew for successive"

  - question: "Which state's law governs the ABC Company agreement?"
    expect_doc: "abc-company-master-services-agreement"
    expect_text: "laws of the State of Delaware"

  - question: "Is there a liability cap in the ABC Company contract?"
    expect_doc: "abc-company-master-services-agreement"
    expect_text: "twelve (12) months immediately preceding"

  - question: "How long do we have to pay an ABC Company invoice?"
    expect_doc: "abc-company-master-services-agreement"
    expect_text: "forty-five (45) days"

  - question: "How much insurance does ABC Company have to carry?"
    expect_doc: "abc-company-master-services-agreement"
    expect_text: "two million dollars"

  - question: "How quickly must ABC Company report a data breach?"
    expect_doc: "abc-company-master-services-agreement"
    expect_text: "seventy-two (72) hours"

  - question: "What happens if either side seriously breaches the ABC Company contract?"
    expect_doc: "abc-company-master-services-agreement"
    expect_text: "thirty (30) days written notice"

  - question: "How long do confidentiality obligations last after the ABC Company contract ends?"
    expect_doc: "abc-company-master-services-agreement"
    expect_text: "five (5) years"

  - question: "Can ABC Company bring in subcontractors?"
    expect_doc: "abc-company-master-services-agreement"
    expect_text: "shall not subcontract"

  - question: "When does the initial term of the ABC Company agreement expire?"
    expect_doc: "abc-company-master-services-agreement"
    expect_text: "14 February 2027"

  # --- ABC Company Amendment No. 2 -----------------------------------------
  - question: "What is the annual price increase cap after the ABC Company amendment?"
    expect_doc: "abc-company-msa-amendment-2"
    expect_text: "four percent (4%)"

  - question: "What uptime did ABC Company commit to in the amendment?"
    expect_doc: "abc-company-msa-amendment-2"
    expect_text: "99.5%"

  - question: "What do we get if ABC Company misses its availability target under the amendment?"
    expect_doc: "abc-company-msa-amendment-2"
    expect_text: "service credit"

  # --- Halcyon Cloud SaaS terms (already scoped — unchanged) ---------------
  - question: "How much notice to cancel the Halcyon subscription?"
    expect_doc: "halcyon-cloud-saas-terms"
    expect_text: "thirty (30) days before the"

  - question: "What availability does Halcyon promise?"
    expect_doc: "halcyon-cloud-saas-terms"
    expect_text: "99.9%"

  - question: "How long can we export our data after leaving Halcyon?"
    expect_doc: "halcyon-cloud-saas-terms"
    expect_text: "available for export"

  - question: "Can Halcyon cut off our access if we pay late?"
    expect_doc: "halcyon-cloud-saas-terms"
    expect_text: "thirty (30) days past"

  - question: "How much can Halcyon raise the price at renewal?"
    expect_doc: "halcyon-cloud-saas-terms"
    expect_text: "seven percent"

  # --- Meridian procurement policy -----------------------------------------
  - question: "What is the maximum annual price escalation our procurement policy allows?"
    expect_doc: "meridian-procurement-policy-2026"
    expect_text: "three percent (3%)"

  - question: "Under our procurement policy, who approves a four hundred thousand dollar purchase?"
    expect_doc: "meridian-procurement-policy-2026"
    expect_text: "Chief Financial Officer"

  - question: "Under our procurement policy, how far ahead of renewal must a contract be reviewed?"
    expect_doc: "meridian-procurement-policy-2026"
    expect_text: "one hundred twenty (120) days"

  - question: "Under our procurement policy, how many quotes do we need for a large purchase?"
    expect_doc: "meridian-procurement-policy-2026"
    expect_text: "three written quotations"

  - question: "Under our procurement policy, what happens if a contract auto-renews because we missed the notice deadline?"
    expect_doc: "meridian-procurement-policy-2026"
    expect_text: "reportable control failure"

  # --- Deliberately unanswerable -------------------------------------------
  - question: "What is the CEO's home address?"
    unanswerable: true

  - question: "How many days of parental leave do employees get?"
    unanswerable: true

  - question: "What was ABC Company's revenue last quarter?"
    unanswerable: true
